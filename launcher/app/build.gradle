plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '2.7'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// prayer_times: the city's table goes into the APK's assets at build time, never fetched by the app. PRAYER_CITY (or
// -PprayerCity) names a table in ../../prayer-tables (index.json gives its name and time zone), or is the path to a
// table of that format with PRAYER_TZ set beside it. Unset: no table, and Home shows no prayer line.
abstract class PrayerAssets extends DefaultTask {
    @Input abstract Property<String> getCity()
    @Input abstract Property<String> getZone()
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE) abstract DirectoryProperty getTables()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void write() {
        File out = outputDir.get().asFile
        project.delete(out)
        String city = this.city.get().trim()
        if (city.isEmpty()) return
        File dir = tables.get().asFile
        File table
        String name
        String zone = this.zone.get().trim()
        if (city.endsWith('.json')) {
            table = new File(city)
            name = table.name - '.json'
            if (zone.isEmpty()) throw new GradleException("PRAYER_CITY is a file: set PRAYER_TZ too (e.g. Europe/Moscow)")
        } else {
            if (!(city ==~ /[a-z0-9-]+/)) throw new GradleException("PRAYER_CITY '$city': a slug from prayer-tables/index.json or a .json path")
            def index = new groovy.json.JsonSlurper().parse(new File(dir, 'index.json'))
            def entry = index[city]
            if (entry == null) throw new GradleException("PRAYER_CITY '$city' is not in prayer-tables/index.json; run tools/prayer_table.py")
            table = new File(dir, city + '.json')
            name = entry.name
            if (zone.isEmpty()) zone = entry.tz
        }
        if (!table.isFile()) throw new GradleException("no prayer table at $table")
        File assets = new File(out, 'prayer')
        assets.mkdirs()
        java.nio.file.Files.copy(table.toPath(), new File(assets, 'table.json').toPath())
        // Written by hand, not Properties.store: no date comment, so the same city builds the same APK.
        def esc = { String v -> v.replace('\\', '\\\\').replace('=', '\\=').replace(':', '\\:') }
        new File(assets, 'city.properties').setText("name=${esc(name)}\ntz=${esc(zone)}\n", 'UTF-8')
    }
}

def prayerAssets = tasks.register('prayerAssets', PrayerAssets) {
    city = providers.gradleProperty('prayerCity').orElse(providers.environmentVariable('PRAYER_CITY')).orElse('')
    zone = providers.gradleProperty('prayerTz').orElse(providers.environmentVariable('PRAYER_TZ')).orElse('')
    tables = rootProject.layout.projectDirectory.dir('../prayer-tables')
    outputDir = layout.buildDirectory.dir('generated/prayer-assets')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(prayerAssets, { it.outputDir })
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
